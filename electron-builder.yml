# electron-builder configuration.
#
# Kept out of package.json so the packaging config is readable on its own.
#
# electron-builder itself is still fetched with npx rather than being a
# devDependency. The original reason — `npm install -D` deadlocking on the
# ntfs3 mount the repo used to live on — no longer applies now that it is on
# btrfs, and v0.13.0 added eslint and its plugins as normal devDependencies
# to prove it. The remaining reason is narrower but real: electron-builder
# pulls ~200 transitive packages that only CI and release builds ever need,
# and none of them belong in the dependency tree a contributor installs to
# run the tests.
#
# Build locally:   npx --yes electron-builder@25 --linux   (or --win / --mac)
# Build in CI:     .github/workflows/build.yml does all three.

appId: com.codyhurst.accessibleweathercenter
productName: Accessible Weather Center
copyright: Copyright © 2026 Cody Hurst

directories:
  output: release
  # Holds icon.svg / icon-tray.svg (the artwork sources) and the icon.png
  # electron-builder derives the Windows .ico, macOS .icns and Linux icon set
  # from. Regenerate with `npm run icons`. Before v0.13.0 this directory did
  # not exist and every installer shipped the default Electron icon.
  buildResources: build

# Explicit rather than relying on the buildResources/icon.png convention, so
# a rename shows up as a build error instead of silently reverting to the
# stock Electron icon.
icon: build/icon.png

# The media library is NOT bundled. It is ~1.3 GB, which would make every
# installer unusable to download, and the app is explicitly designed to run
# without it (system fonts, no music, screen-reader narration only). Users
# install it separately with `npm run assets:fetch`, which unpacks into the
# app's userData directory where the custom protocol handler looks for it.
# See docs/asset-pipeline.md and the README.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"

# Anything listed here would be copied into the installer as-is. Kept empty
# on purpose — see the note above.
extraResources: []

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-windows-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Screen-reader users should not have to hunt a silent installer.
  runAfterFinish: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.weather
  artifactName: ${productName}-${version}-macos-${arch}.${ext}
  # No Apple Developer certificate, so builds are unsigned and unnotarized.
  # macOS will refuse to open them on first launch until the user clears the
  # quarantine flag — the README documents the exact command.
  identity: null

dmg:
  writeUpdateInfo: false

linux:
  # A directory, not the single icon.png. Handed one PNG, electron-builder
  # ships exactly that size, so a 1024px image gets scaled into a 16px menu
  # slot by whatever the desktop environment happens to use. build/icons/
  # holds 16 through 1024, with the small ones rendered from the simplified
  # tray artwork. Regenerate with `npm run icons`.
  icon: build/icons
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Science
  synopsis: Fully accessible weather application with a Weatherscan-style cycling display
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
