<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: the renderer displays remote-derived text (NWS alerts, FAA XML,
         Icecast JSON), so lock scripts to self while allowing the data/tile/
         stream hosts the app legitimately talks to. ws://localhost is Vite
         HMR in dev; 'unsafe-inline' styles are required by React inline
         style attributes and the Google Fonts stylesheet import. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https: ws://localhost:5173 http://localhost:5173; object-src 'none'; base-uri 'self'"
    />
    <title>Accessible Weather Center</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
