# Accessible Weather Center — weather.codyhurst.com
#
# Installed to /etc/nginx/sites-available/ and symlinked into sites-enabled/
# by deploy/server-setup.sh. See docs/web-deployment.md for the full runbook.
#
# Directory layout under the web root:
#   /var/www/weather.codyhurst.com/
#     index.html          <- your landing page (never touched by publish.sh)
#     app/                <- the application: dist/ from `npm run build`
#       index.html
#       static/           <- hashed JS/CSS/font bundle
#     assets/             <- the ~1.3 GB media library
#
# URL map:
#   /              landing page
#   /app/          the application
#   /assets/       media library (narration, backgrounds, music, icons, fonts)
#   /nwr/          reverse proxy to weatherUSA's Icecast server
#
# Two things worth knowing before editing:
#
# 1. /assets/ must stay at the site ROOT and on this SAME ORIGIN. Every media
#    URL the app builds at runtime is root-relative ("/assets/..."), so it
#    resolves identically no matter where the app itself is mounted. Same
#    origin is not a preference: the clip player feeds audio through a
#    MediaElementAudioSourceNode, and WebAudio refuses cross-origin media
#    without CORS headers. Moving the library to a CDN hostname requires
#    adding CORS there or the narration goes silent.
#
# 2. /app/static/ (the Vite bundle) and /assets/ (the media library) are
#    different things. Fonts and CSS-referenced images are fingerprinted into
#    the bundle by Vite; the media library is fetched at runtime by URL.
#
# This file uses `root` rather than `alias` throughout: URL paths map 1:1 onto
# directory names, and `alias` combined with `try_files` is a well-known
# source of surprising behaviour.

server {
    listen 80;
    listen [::]:80;
    server_name weather.codyhurst.com;

    # Certbot renewals use the webroot plugin; this must stay reachable over
    # plain HTTP and must be matched BEFORE the redirect below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/weather.codyhurst.com;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name weather.codyhurst.com;

    ssl_certificate     /etc/letsencrypt/live/weather.codyhurst.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weather.codyhurst.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/weather.codyhurst.com;
    index index.html;

    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The app talks to api.weather.gov, api.zippopotam.us, RainViewer and
    # basemap tiles straight from the browser; the NWR stream comes from this
    # origin via /nwr/. The Content-Security-Policy itself lives in the app's
    # index.html <meta> tag — keep the two in step if you tighten either.

    # Compress text only. mp3/webp/woff2 are already compressed; gzipping them
    # spends CPU to make files marginally larger.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 1.3 GB of media in ~13,650 files. Serve it efficiently.
    sendfile on;
    tcp_nopush on;

    # ---- landing page (yours — publish.sh never writes here) --------------
    location = / {
        try_files /index.html =404;
    }

    # ---- application -------------------------------------------------------
    location = /app {
        return 301 /app/;
    }

    location /app/ {
        # SPA fallback so a reload on any in-app path serves the shell.
        try_files $uri $uri/ /app/index.html;
    }

    # The shell must never be cached, or a deploy leaves users on stale JS
    # that references bundle files which no longer exist.
    location = /app/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Bundle filenames are content-hashed, so they can be cached forever.
    location /app/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- media library -----------------------------------------------------
    # Filenames are stable and contents immutable, so a returning visitor
    # re-downloads none of it. Audio elements issue Range requests; nginx
    # serves byte ranges for static files automatically.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        autoindex off;

        # A missing clip must 404, not fall through to the SPA shell — an
        # HTML document delivered as audio fails in a much more confusing way.
        try_files $uri =404;
    }

    # Transcoder bookkeeping that ships alongside the media. Not secret, but
    # there's no reason to serve it.
    location = /assets/_transcode-report.json { return 404; }

    # ---- NOAA Weather Radio proxy -----------------------------------------
    # radio.weatherusa.net sends no Access-Control-Allow-Origin header on
    # either the status document or the MP3 mounts (verified 2026-08-06 by
    # requesting both with an explicit Origin header). A browser therefore
    # cannot list stations, and cannot feed the stream into WebAudio at all.
    # Proxying puts both on our own origin and solves it.
    #
    # Cost: one upstream connection per listener at 32-128 kbps. Ten
    # concurrent listeners is well under 1 Mbit/s in each direction.
    #
    # The more specific status location must be declared BEFORE the general
    # prefix so it wins; nginx picks the longest matching prefix, and an exact
    # (=) match beats every prefix, so ordering here is for human readers.
    location = /nwr/status-json.xsl {
        proxy_pass https://radio.weatherusa.net/status-json.xsl;
        proxy_set_header Host radio.weatherusa.net;
        proxy_set_header User-Agent "AccessibleWeatherCenter (+https://weather.codyhurst.com)";
        proxy_ssl_server_name on;

        # The directory changes as contributors start and stop feeds. A short
        # cache keeps a busy moment from hammering upstream, without letting
        # the list go meaningfully stale.
        proxy_cache_valid 200 60s;
        expires 60s;
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "$scheme://$host" always;
    }

    location /nwr/ {
        proxy_pass https://radio.weatherusa.net/;
        proxy_http_version 1.1;
        proxy_set_header Host radio.weatherusa.net;
        proxy_set_header User-Agent "AccessibleWeatherCenter (+https://weather.codyhurst.com)";
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;

        # Live audio: buffering adds latency and memory for no benefit.
        proxy_buffering off;
        proxy_request_buffering off;

        # A stream is open-ended. Don't cut it off mid-broadcast.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        add_header Access-Control-Allow-Origin "$scheme://$host" always;
    }

    access_log /var/log/nginx/weather.codyhurst.com.access.log;
    error_log  /var/log/nginx/weather.codyhurst.com.error.log;
}
